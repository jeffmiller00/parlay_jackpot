name: Debug OpenAI request

# Temporary diagnostic workflow. Not on main; delete this branch when done.

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Debug OpenAI request
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: bundle exec ruby scripts/debug_openai.rb
